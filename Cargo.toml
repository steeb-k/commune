# The application and the headless core it is being moved onto resolve one
# dependency graph and share one lock file, so a version can never differ
# between the GTK build and the Android one. See Track 3 of
# `doc/kotlin-plan.md`.
[workspace]
members = ["commune-core"]
# The pre-commit checks are a build tool, not part of the application; they
# keep their own lock so their dependencies never reach the shipped binary.
exclude = ["hooks/checks"]

[package]
name = "commune"
version = "1.0.0-rc4"
authors = ["Julian Sparber <julian@sparber.net>"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.95"
publish = false

[package.metadata.cargo-machete]
ignored = [
    # Never called; present on Android only, to turn on `bundled` for the
    # `rusqlite` that `matrix-sdk-sqlite` depends on. See the Android section
    # below for why that is necessary.
    "rusqlite",
    # Used by `build.rs`, inside a `cfg(target_os = "windows")` that
    # cargo-machete does not follow.
    "winresource",
    # Named only by what `#[implement]` expands to, in
    # `src/utils/windows_toast_activator.rs`, so no source file mentions it.
    "windows-core",
]

[profile.release]
debug = true
lto = "thin"
# Upstream builds the crate as a single codegen unit. That is worth a few
# percent at most, and it costs about forty minutes: the dependencies are
# already optimised by the `dev.package."*"` profile below and cached, so a
# release build is one crate, and one codegen unit means compiling it with no
# parallelism at all. `opt-level` and thin LTO are where the speed actually
# comes from, and both are kept.
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

# Please keep dependencies sorted.
[dependencies]
as_variant = "1.3.0"
blurhash = "0.2"
cfg-if = "1"
# The headless core. `default-features = false` leaves the `ffi` feature off,
# so the application links the crate with no UniFFI runtime in it; only the
# Android build of the core turns it on. Track 3 of `doc/kotlin-plan.md` moves
# the application's model layer onto this crate module by module, and
# `doc/track3-convergence.md` is the running record of it.
commune-core = { path = "commune-core", default-features = false }
futures-channel = "0.3"
futures-util = "0.3"
geo-uri = "0.2"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
http = "1.5"
indexmap = "2"
linkify = "0.11"
mime = "0.3"
mime_guess = "2"
pulldown-cmark = "0.13"
qrcode = { version = "0.14", default-features = false }
quick_cache = "0.7"
regex = "1"
secular = { version = "1", features = ["bmp", "normalization"] }
serde = "1"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tld = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webp = { version = "0.3", default-features = false }

# gtk-rs project and dependents. These usually need to be updated together.
adw = { version = "0.9", features = ["v1_8"], package = "libadwaita" }
gst = { version = "0.25", package = "gstreamer" }
gst_app = { version = "0.25", package = "gstreamer-app" }
gst_pbutils = { version = "0.25", package = "gstreamer-pbutils" }
gst_play = { version = "0.25", package = "gstreamer-play" }
gst_video = { version = "0.25", package = "gstreamer-video" }
gtk = { version = "0.11", features = ["gnome_49"], package = "gtk4" }
sourceview = { version = "0.11", package = "sourceview5" }

[dependencies.matrix-sdk]
# version = "0.18"
git = "https://github.com/matrix-org/matrix-rust-sdk.git"
rev = "db02d6ce8e8d91ab5ab1fd726e45d53263f8132c"
default-features = false
features = [
    "automatic-room-key-forwarding",
    "e2e-encryption",
    "experimental-search",
    "markdown",
    "qrcode",
    "rustls-aws-lc-rs",
    "socks",
    "sqlite",
    "sso-login",
]

[dependencies.matrix-sdk-base]
# version = "0.18"
git = "https://github.com/matrix-org/matrix-rust-sdk.git"
rev = "db02d6ce8e8d91ab5ab1fd726e45d53263f8132c"
default-features = false
features = ["e2e-encryption"]

[dependencies.matrix-sdk-ui]
# version = "0.18"
git = "https://github.com/matrix-org/matrix-rust-sdk.git"
rev = "db02d6ce8e8d91ab5ab1fd726e45d53263f8132c"
default-features = false
features = ["experimental-search"]

[dependencies.ruma]
# version = "0.16"
git = "https://github.com/ruma/ruma.git"
rev = "db24422e03aea7c7974230098fe9aeb5481cddc6"
features = [
    "client-api-c",
    "identity-service-api-c",
    "markdown",
    "html-matrix",
    "compat-arbitrary-length-ids",
    "compat-server-signing-key-version",
    "compat-empty-string-null",
    "compat-null",
    "compat-optional",
    "compat-unset-avatar",
    "compat-lax-room-create-deser",
    "compat-lax-room-topic-deser",
]

# The last of GStreamer that Android does not have. Both of these are for
# calls, which are their own step; everything media needs is in the common table
# above. Part of the gtk-rs family, and still updated together with it.
[target.'cfg(not(target_os = "android"))'.dependencies]
gst_sdp = { version = "0.25", package = "gstreamer-sdp" }
gst_webrtc = { version = "0.25", package = "gstreamer-webrtc" }
# libshumate wants libsoup-3.0, json-glib, libprotobuf-c and sqlite3, none of
# which are cross-built. Unlike GtkSourceView, which is now a wrap, the map is
# reached from one file and one message row, so Android goes without it.
shumate = { version = "0.8", features = ["v1_1"], package = "libshumate" }

# The image decoder used where glycin is not available.
[target.'cfg(not(target_os = "linux"))'.dependencies]
image = { version = "0.25.5", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }

# Android-only dependencies.
[target.'cfg(target_os = "android")'.dependencies]
# `gtk4paintablesink`, which everything here renders video through. Every other
# platform finds it at run time — the GNOME runtime ships it, and so does the
# conda-forge build on macOS — but nothing on Android does: it is the one plugin
# in this application that depends on GTK, so Cerbero cannot build it and the
# upstream Android binaries do not carry it. Building it here is not a
# workaround, it is the same plugin from the same source, registered statically
# with `gst::plugin_define!` like every other plugin in this build.
gst_gtk4 = { version = "0.15", package = "gst-plugin-gtk4" }
# Not a new dependency, only a wider one. `gtk::Svg` is GTK's own SVG renderer,
# public since 4.22 and behind that feature in gtk-rs, and on Android it is the
# only thing that will draw an SVG: the `image` crate has never read one, and
# there is no librsvg in the APK for the GdkPixbuf fallback to reach. Enabled
# here rather than beside the main `gtk` entry because Cargo unions features per
# target, and the Linux build targets the GNOME 49 runtime, which is GTK 4.20 —
# turning it on there would let us call symbols that are not in that library.
gtk = { version = "0.11", features = ["v4_22"], package = "gtk4" }
# The Android Keystore is a Java API and there is no other way to reach it: the
# keys are non-extractable by design, so the encryption has to happen on the
# other side of JNI rather than with key material handed back to us.
jni = "0.21"
# `tracing` has nowhere to go on Android without a logcat sink.
paranoid-android = "0.2"
# Never used directly. It is here to turn on `bundled` for the `rusqlite` that
# `matrix-sdk-sqlite` pulls in, which makes `libsqlite3-sys` compile SQLite from
# source rather than look for a system one.
#
# Android does have SQLite, but not as an NDK API: there is no `libsqlite3.so`
# anywhere in the NDK sysroot, so nothing native can link against it and every
# application wanting SQLite ships its own. Only Android turns this on, so every
# other platform still links the system library exactly as before.
rusqlite = { version = "0.40", features = ["bundled"] }
# `rustls` and `rustls-pemfile` left with `src/utils/tls.rs`, which is
# `commune_core::tls` now — the reason they were here (configuring Android's
# TLS from the device trust store, because `rustls-platform-verifier` panics
# there) is unchanged, it is just the core's reason. See
# `doc/track3-convergence.md`.

# Linux-only dependencies.
[target.'cfg(target_os = "linux")'.dependencies]
aperture = "0.12"
ashpd = { version = "0.13.9", default-features = false, features = [
    "camera",
    "location",
    "settings",
    "tracing",
    "tokio",
] }
glycin = { version = "0.1", package = "libglycin-rebind" }
glycin-gtk4 = { version = "0.1", package = "libglycin-gtk4-rebind" }

# macOS-only dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "block2",
    "std",
    "UNError",
    "UNNotification",
    "UNNotificationAttachment",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

# Windows-only dependencies.
[target.'cfg(target_os = "windows")'.dependencies]
# `win32` gives its `HWND` (and friends) as the `windows` crate's own types,
# rather than its fallback newtype, so `windows_frame` needs no conversion.
gdk4-win32 = { version = "0.11", features = ["win32"] }
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # `WinVerifyTrust`, which `utils::windows_update` asks whether a
    # downloaded package is signed before handing it to `msiexec`.
    # `WINTRUST_DATA` is behind the Cryptography feature rather than the
    # WinTrust one, so both are needed for the one call.
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The `#[implement]` macro that builds the notification activator expands to
# paths in `windows_core`, so it has to be nameable at the crate root rather
# than only through `windows::core`.
windows-core = "0.62"

[dev-dependencies]
assert_matches2 = "0.1"

# The icon, the version information and the manifest that `build.rs` compiles
# into the executable. Windows has no metadata file beside the binary to put
# them in, the way a macOS bundle has its `Info.plist`.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[lints.rust]
# ruma's `EventContent` derive emits this cfg; it is ruma's to set, not ours.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(ruma_unstable_exhaustive_types)',
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
default_trait_access = "allow"
module_name_repetitions = "allow"
new_without_default = "allow"
struct_field_names = "allow"
unsafe_derive_deserialize = "allow"
wildcard_imports = "allow"
