[package]
name = "commune"
version = "14.1.0"
authors = ["Julian Sparber <julian@sparber.net>"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.95"
publish = false

[package.metadata.cargo-machete]
ignored = [
    # Used by the SecretFile API.
    "serde_bytes",
    # Used by `build.rs`, inside a `cfg(target_os = "windows")` that
    # cargo-machete does not follow.
    "winresource",
]

[profile.release]
debug = true
lto = "thin"
# Upstream builds the crate as a single codegen unit. That is worth a few
# percent at most, and it costs about forty minutes: the dependencies are
# already optimised by the `dev.package."*"` profile below and cached, so a
# release build is one crate, and one codegen unit means compiling it with no
# parallelism at all. `opt-level` and thin LTO are where the speed actually
# comes from, and both are kept.
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

# Please keep dependencies sorted.
[dependencies]
as_variant = "1.3.0"
blurhash = "0.2"
cfg-if = "1"
futures-channel = "0.3"
futures-util = "0.3"
geo-uri = "0.2"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
indexmap = "2"
linkify = "0.11"
mime = "0.3"
mime_guess = "2"
pulldown-cmark = "0.13"
qrcode = { version = "0.14", default-features = false }
quick_cache = "0.7"
rand = "0.10"
regex = "1"
rmp-serde = "1"
secular = { version = "1", features = ["bmp", "normalization"] }
serde = "1"
serde_bytes = "0.11"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tld = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webp = { version = "0.3", default-features = false }
zeroize = "1"

# gtk-rs project and dependents. These usually need to be updated together.
adw = { version = "0.9", features = ["v1_8"], package = "libadwaita" }
gst = { version = "0.25", package = "gstreamer" }
gst_app = { version = "0.25", package = "gstreamer-app" }
gst_pbutils = { version = "0.25", package = "gstreamer-pbutils" }
gst_play = { version = "0.25", package = "gstreamer-play" }
gst_sdp = { version = "0.25", package = "gstreamer-sdp" }
gst_video = { version = "0.25", package = "gstreamer-video" }
gst_webrtc = { version = "0.25", package = "gstreamer-webrtc" }
gtk = { version = "0.11", features = ["gnome_49"], package = "gtk4" }
shumate = { version = "0.8", features = ["v1_1"], package = "libshumate" }
sourceview = { version = "0.11", package = "sourceview5" }

[dependencies.matrix-sdk]
# version = "0.18"
git = "https://github.com/matrix-org/matrix-rust-sdk.git"
rev = "db02d6ce8e8d91ab5ab1fd726e45d53263f8132c"
default-features = false
features = [
    "automatic-room-key-forwarding",
    "e2e-encryption",
    "experimental-search",
    "markdown",
    "qrcode",
    "rustls-aws-lc-rs",
    "socks",
    "sqlite",
    "sso-login",
]

[dependencies.matrix-sdk-store-encryption]
# version = "0.18"
git = "https://github.com/matrix-org/matrix-rust-sdk.git"
rev = "db02d6ce8e8d91ab5ab1fd726e45d53263f8132c"

[dependencies.matrix-sdk-ui]
# version = "0.18"
git = "https://github.com/matrix-org/matrix-rust-sdk.git"
rev = "db02d6ce8e8d91ab5ab1fd726e45d53263f8132c"
default-features = false
features = ["experimental-search"]

[dependencies.ruma]
# version = "0.16"
git = "https://github.com/ruma/ruma.git"
rev = "db24422e03aea7c7974230098fe9aeb5481cddc6"
features = [
    "client-api-c",
    "markdown",
    "html-matrix",
    "compat-arbitrary-length-ids",
    "compat-server-signing-key-version",
    "compat-empty-string-null",
    "compat-null",
    "compat-optional",
    "compat-unset-avatar",
    "compat-lax-room-create-deser",
    "compat-lax-room-topic-deser",
]

# The image decoder used where glycin is not available.
[target.'cfg(not(target_os = "linux"))'.dependencies]
image = { version = "0.25.5", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }

# Linux-only dependencies.
[target.'cfg(target_os = "linux")'.dependencies]
aperture = "0.12"
ashpd = { version = "0.13.9", default-features = false, features = [
    "camera",
    "location",
    "settings",
    "tracing",
    "tokio",
] }
glycin = { version = "0.1", package = "libglycin-rebind" }
glycin-gtk4 = { version = "0.1", package = "libglycin-gtk4-rebind" }
oo7 = { version = "0.7.0-alpha", default-features = false, features = [
    "native_crypto",
    "tokio",
    "tracing",
] }

# macOS-only dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "block2",
    "std",
    "UNError",
    "UNNotification",
    "UNNotificationAttachment",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
security-framework = "3"

# Windows-only dependencies.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[dev-dependencies]
assert_matches2 = "0.1"

# The icon, the version information and the manifest that `build.rs` compiles
# into the executable. Windows has no metadata file beside the binary to put
# them in, the way a macOS bundle has its `Info.plist`.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[lints.rust]
# ruma's `EventContent` derive emits this cfg; it is ruma's to set, not ours.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(ruma_unstable_exhaustive_types)',
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
default_trait_access = "allow"
module_name_repetitions = "allow"
new_without_default = "allow"
struct_field_names = "allow"
unsafe_derive_deserialize = "allow"
wildcard_imports = "allow"
