# The gate that used to be local only.
#
# `RELEASING.md` said, until this file existed, that the local checks were the
# whole gate — there was no CI on the GitHub repository, and the inherited
# `.gitlab-ci.yml` has never run there. This is that same gate, run on every
# push: `hooks/checks` is the binary the pre-commit hook calls, so there is one
# definition of what "clean" means rather than two that drift.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Style, lints and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `hooks/doc-freshness` and the build number both ask git how many
          # commits there are, and a shallow clone answers wrongly.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the nightly rustfmt
        # Only rustfmt, and only nightly: the project formats with unstable
        # options, which is why `hooks/checks` invokes `cargo +nightly fmt`.
        #
        # Pinned to a date rather than tracking `nightly`, because
        # `wrap_comments = true` is one of those options and successive
        # nightlies rewrap comments differently. Unpinned, this job fails on
        # whatever morning rustfmt changes its mind, having been given nothing
        # to do with it. Bump this when a developer bumps their own nightly,
        # and reformat the tree in the same commit.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-23
          components: rustfmt

      - name: Make `+nightly` mean the pinned one
        # `hooks/checks` runs `cargo +nightly fmt`, which resolves a toolchain
        # by that exact name, and rustup will not let a dated toolchain be
        # linked under a reserved channel name. Pointing the channel's
        # directory at the dated one is what makes the two agree. The version
        # is printed so a run says which rustfmt actually judged the tree.
        run: |
          cd ~/.rustup/toolchains
          ln -sfn nightly-2026-08-23-x86_64-unknown-linux-gnu nightly-x86_64-unknown-linux-gnu
          cargo +nightly fmt --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      - name: Install the check tools
        run: |
          cargo install --locked cargo-deny cargo-machete cargo-sort typos-cli rumdl

      - name: Build the gate
        run: cargo build --release --manifest-path hooks/checks/Cargo.toml

      - name: Run the gate
        run: |
          cp hooks/checks/target/release/checks hooks/checks-bin
          hooks/checks-bin

      - name: The workflows themselves
        # A workflow file can be valid YAML and still be rejected by GitHub —
        # a duplicate key, a hyphen in a property path — and the only symptom
        # is a run that fails in zero seconds saying "workflow file issue".
        # actionlint is what catches those before a push does.
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -color

      - name: Widget templates against the Rust that builds them
        run: hooks/template-checks

      - name: Documentation freshness
        # Warns rather than blocks, exactly as the pre-commit hook does: a
        # documentation page that is one commit behind is worth saying out
        # loud and not worth refusing a merge over.
        continue-on-error: true
        run: hooks/doc-freshness

  test:
    name: Tests
    runs-on: ubuntu-latest
    container:
      image: quay.io/gnome_infrastructure/gnome-runtime-images:gnome-50
      options: --privileged --user root
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: The tools Meson looks for
        # The runtime image carries the libraries, not the build tooling.
        # `meson.build` asks for these by name and fails configure without
        # them; `grass` is the Rust SASS compiler it prefers over `sass`.
        run: |
          echo "--- what the image already has ---"
          for tool in gcc cc ld meson ninja sass sassc grass blueprint-compiler pkg-config python3 pip3 dnf apt-get; do
            echo "  $tool -> $(command -v "$tool" || echo MISSING)"
          done

          echo "--- a C compiler, which cargo needs for any build script ---"
          if ! command -v cc >/dev/null; then
            if command -v gcc >/dev/null; then
              ln -sf "$(command -v gcc)" /usr/local/bin/cc
            elif command -v dnf >/dev/null; then
              dnf install -y gcc
            elif command -v apt-get >/dev/null; then
              apt-get update && apt-get install -y gcc
            fi
          fi
          command -v cc || echo "::error::no C compiler in the image"

          echo "--- meson and ninja ---"
          command -v meson >/dev/null || python3 -m pip install --break-system-packages meson ninja || python3 -m pip install meson ninja

          echo "--- a SASS compiler, which data/resources/meson.build requires ---"
          if ! command -v sass >/dev/null && ! command -v grass >/dev/null; then
            # The prebuilt dart-sass, rather than building grass from source:
            # this step runs before it is known that cargo can compile at all.
            curl -fsSL -o /tmp/sass.tar.gz https://github.com/sass/dart-sass/releases/download/1.83.4/dart-sass-1.83.4-linux-x64.tar.gz
            tar -xzf /tmp/sass.tar.gz -C /opt
            ln -sf /opt/dart-sass/sass /usr/local/bin/sass
          fi

          echo "--- versions ---"
          meson --version
          sass --version || grass --version
          blueprint-compiler --version || echo "::warning::no blueprint-compiler in the image"

      - name: Configure
        # A build directory is what generates `src/config.rs`, which the
        # application crate will not compile without.
        run: meson setup _build -Dprofile=development

      - name: Test the core
        run: cargo test -p commune-core

      - name: Test the application
        # `--bin commune` rather than the whole target set: the `#[gtk::test]`
        # tests need a display, and this job has none.
        run: cargo test -j 2 --bin commune
