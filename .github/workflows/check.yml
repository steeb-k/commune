# The gate that used to be local only.
#
# `RELEASING.md` said, until this file existed, that the local checks were the
# whole gate — there was no CI on the GitHub repository, and the inherited
# `.gitlab-ci.yml` has never run there. This is that same gate, run on every
# push: `hooks/checks` is the binary the pre-commit hook calls, so there is one
# definition of what "clean" means rather than two that drift.
#
# # Why Fedora and not the GNOME images
#
# The first attempt used `quay.io/gnome_infrastructure/gnome-runtime-images`,
# on the assumption that an image named for the GNOME runtime carries the
# GNOME development files. It carries almost nothing: no compiler, no
# pkg-config, no meson. Those images are a base for `flatpak-builder`, which
# brings its own runtime along, so there is no reason for anything to be
# installed in the image itself.
#
# What this gate needs is the opposite — a native toolchain — because
# `hooks/checks` runs clippy, and clippy has to compile the application
# against real GTK headers. Fedora is the distribution carrying GTK new enough
# for `meson.build`'s floor of 4.20.2.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    name: Workflow files
    # Separate and first, because it takes seconds rather than minutes and it
    # catches the class of mistake that stops every other job running at all:
    # a workflow that is valid YAML and still one GitHub refuses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -color

  gate:
    name: Gate and tests
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: The build environment
        # One `dnf` rather than a curated list per job: the gate compiles the
        # application through clippy, so it needs everything a build needs
        # anyway, and splitting it across two jobs would install all of this
        # twice.
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ clang cmake make perl git which \
            pkgconf-pkg-config meson ninja-build \
            glib2-devel gtk4-devel libadwaita-devel \
            gtksourceview5-devel libshumate-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            gstreamer1-plugins-bad-free-devel \
            sqlite-devel openssl-devel libwebp-devel \
            blueprint-compiler desktop-file-utils
          # glycin decodes images on Linux and only there, so `meson.build`
          # asks for it under a host check. Fedora has moved the package name
          # around, so try the spellings rather than pin one.
          for pkg in libglycin-devel libglycin-gtk4-devel glycin-devel glycin-gtk4-devel; do
            dnf install -y --setopt=install_weak_deps=False "$pkg" || true
          done
          echo "--- versions this gate builds against ---"
          pkg-config --modversion gtk4 libadwaita-1 glib-2.0 gstreamer-1.0 gtksourceview-5
          pkg-config --modversion glycin-2 glycin-gtk4-2 || echo "::error::no glycin, which meson.build requires on Linux"

      - uses: actions/checkout@v5
        with:
          # `hooks/doc-freshness` and the build number both ask git how many
          # commits there are, and a shallow clone answers wrongly.
          fetch-depth: 0

      - name: Trust the checkout
        # The container is root and the checkout is not, and git refuses to
        # touch a repository it thinks belongs to somebody else.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install the nightly rustfmt
        # Only rustfmt, and only nightly: the project formats with unstable
        # options, which is why `hooks/checks` invokes `cargo +nightly fmt`.
        #
        # Pinned to a date rather than tracking `nightly`, because
        # `wrap_comments = true` is one of those options and successive
        # nightlies rewrap comments differently. Unpinned, this job fails on
        # whatever morning rustfmt changes its mind, having been given nothing
        # to do about it. Bump this when a developer bumps their own nightly,
        # and reformat the tree in the same commit.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-23
          components: rustfmt

      - name: Make `+nightly` mean the pinned one
        # `hooks/checks` runs `cargo +nightly fmt`, which resolves a toolchain
        # by that exact name, and rustup will not link a dated toolchain under
        # a reserved channel name. Pointing the channel's directory at the
        # dated one is what makes the two agree.
        run: |
          cd ~/.rustup/toolchains
          ln -sfn nightly-2026-08-23-x86_64-unknown-linux-gnu nightly-x86_64-unknown-linux-gnu
          cargo +nightly fmt --version

      - uses: Swatinem/rust-cache@v2

      - name: A SASS compiler
        # `data/resources/meson.build` wants `grass` or `sass`. The prebuilt
        # dart-sass rather than building grass from source, which is a minute
        # of compiling for one stylesheet.
        run: |
          curl -fsSL -o /tmp/sass.tar.gz https://github.com/sass/dart-sass/releases/download/1.83.4/dart-sass-1.83.4-linux-x64.tar.gz
          tar -xzf /tmp/sass.tar.gz -C /opt
          ln -sf /opt/dart-sass/sass /usr/local/bin/sass
          sass --version

      - name: Configure
        # A build directory is what generates `src/config.rs`, which nothing
        # in the application compiles without — clippy included.
        run: meson setup _build -Dprofile=development

      - name: Install the check tools
        run: cargo install --locked cargo-deny cargo-machete cargo-sort typos-cli rumdl

      - name: Run the gate
        run: |
          cargo build --release --manifest-path hooks/checks/Cargo.toml
          cp hooks/checks/target/release/checks hooks/checks-bin
          hooks/checks-bin

      - name: Widget templates against the Rust that builds them
        run: hooks/template-checks

      - name: Documentation freshness
        # Warns rather than blocks, exactly as the pre-commit hook does: a
        # documentation page that is one commit behind is worth saying out
        # loud and not worth refusing a merge over.
        continue-on-error: true
        run: hooks/doc-freshness

      - name: Test the core
        run: cargo test -p commune-core

      - name: Test the application
        # `--bin commune` rather than the whole target set: the `#[gtk::test]`
        # tests need a display, and this job has none.
        run: cargo test -j 2 --bin commune
