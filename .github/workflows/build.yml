# Every platform's artifact, built once and reused.
#
# Called by `release.yml` for a tag and by `nightly.yml` for a push to `main`.
# The only difference between the two is the profile, which is why this is one
# file taking it as an input rather than two that drift apart.
#
# See `doc/updates-plan.md` for what these artifacts are for: each is what an
# installed Commune downloads to replace itself, so their names and their
# signing matter as much as the builds do.
#
# # Why the platforms run in parallel
#
# They did not, at first. The jobs were chained android -> flatpak -> windows
# -> macos, deliberately, so that the platform most likely to fail ran last
# and a failure was cheap to reach. That was the right shape while none of
# them had ever run: the first attempt at each found real defects, and there
# was no point compiling macOS to learn that Android was broken.
#
# It is the wrong shape now that all of them pass. A release needs every
# platform regardless of order, so ordering buys nothing and the chain costs
# the sum of the jobs instead of the longest one — about two and a quarter
# hours against fifty minutes. The one dependency left is real: the universal
# bundle cannot be merged before the two halves exist.
name: build

on:
  workflow_call:
    inputs:
      meson-profile:
        description: 'The Meson profile: default for a release, development for a nightly.'
        required: true
        type: string
      windows-profile:
        description: 'The MSI profile: Stable or Devel. It picks the UpgradeCode, so it decides what an installed copy upgrades.'
        required: true
        type: string
      sign:
        description: 'Whether to sign. Off for a pull request, which cannot reach the secrets anyway.'
        required: false
        default: true
        type: boolean
      platforms:
        description: 'Which platforms to build: all, or a space-separated list of windows macos android flatpak.'
        required: false
        default: all
        type: string
      ref:
        description: >-
          The commit to build. Defaults to whatever triggered the run, which
          is right for a tag push and wrong for the one case that matters:
          rebuilding a tag by hand after a CI bug. A reusable workflow called
          by path runs at the caller's commit, so dispatching `release.yml`
          from `main` gets `main`'s workflow — which is the point, that being
          where the fix is — but every checkout below would also have taken
          `main`'s source, quietly publishing something other than the tag.
          Naming the ref is what keeps the workflow and the source separable.
        required: false
        default: ''
        type: string

# `azure/login` asks GitHub for an OIDC token, which is what replaces a stored
# client secret for the Windows signing step.
permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    if: >-
      !cancelled()
      && (inputs.platforms == 'all' || contains(format(' {0} ', inputs.platforms), ' android '))
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk
      - name: Install the pinned NDK
        # The version build-core.sh pins, not whichever the runner image
        # happens to carry: this .so is shipped, so it should come out of the
        # same toolchain as a local build.
        run: |
          NDK_VERSION=$(grep '^NDK_VERSION=' android-kotlin/build-core.sh | cut -d- -f2 | tr -d '}')
          echo "pinned NDK: $NDK_VERSION"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null


      - name: Build the core for the device
        env:
          # The library is stripped immediately afterwards, so every minute
          # spent producing debug info is a minute spent on bytes that are
          # thrown away.
          CARGO_PROFILE_RELEASE_DEBUG: 'false'
        # arm64 only: it is the one ABI the release variant packages, and
        # building the emulator's as well doubles the slowest step here.
        run: cd android-kotlin && ./build-core.sh --release --arm64

      - name: Write the release keystore
        # The key that decides whether an APK can upgrade an installed one.
        # Without it the build still succeeds and signs with the debug key,
        # which is the right answer for a fork or a pull request: it produces
        # something installable that simply cannot upgrade a released copy.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No release keystore; this APK is debug-signed and cannot upgrade a released install."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android-kotlin/commune-release.jks
          {
            echo "storeFile=commune-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=commune"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android-kotlin/keystore.properties

      - name: Supply the KLIPY key
        # Through local.properties, which build.gradle.kts already reads and
        # .gitignore already covers — not `-P`, which would put the key in
        # the process list for anything on the runner to read.
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: |
          echo "communeKlipyApiKey=$KLIPY_API_KEY" >> android-kotlin/local.properties

      - name: Build the APK
        run: cd android-kotlin && ./gradlew assembleRelease

      - name: Name it after the release
        run: |
          version="$(bash build-aux/ci/project-version.sh)"
          mkdir -p dist
          cp android-kotlin/app/build/outputs/apk/release/app-release.apk "dist/commune-$version-arm64-v8a.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  flatpak:
    if: >-
      !cancelled()
      && (inputs.platforms == 'all' || contains(format(' {0} ', inputs.platforms), ' flatpak '))
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: quay.io/gnome_infrastructure/gnome-runtime-images:gnome-50
      # Root inside it: the image defines a non-root user, which cannot write
      # the runner's own temp directory, so checkout fails on EACCES.
      options: --privileged --user root
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Supply the KLIPY key
        # The manifest cannot read a secret, and committing the key into it
        # would put it in the repository — which is the thing that went
        # wrong once already. Injected into the working copy instead, so the
        # built Flatpak matches the other three platforms while the tracked
        # manifest stays clean. A Flathub build, which uses the tracked
        # manifest, therefore has no GIF search.
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          MANIFEST: ${{ inputs.meson-profile == 'default' && 'build-aux/io.github.steeb_k.Commune.json' || 'build-aux/io.github.steeb_k.Commune.Devel.json' }}
        run: |
          python3 - "$MANIFEST" <<'EOF'
          import json, os, sys
          path = sys.argv[1]
          key = os.environ.get("KLIPY_API_KEY", "")
          if not key:
              print("no KLIPY key; leaving the manifest alone")
              raise SystemExit(0)
          manifest = json.load(open(path, encoding="utf-8"))
          for module in manifest["modules"]:
              if isinstance(module, dict) and module.get("name") == "commune":
                  opts = module.setdefault("config-opts", [])
                  opts.append("-Dklipy-api-key=" + key)
                  break
          else:
              raise SystemExit("no commune module in " + path)
          json.dump(manifest, open(path, "w", encoding="utf-8"), indent=4)
          print("injected the KLIPY option")
          EOF

      - name: The Flathub remote
        # The image carries GNOME's nightly remote, not Flathub, so the
        # builder's attempt to install org.gnome.Sdk//50 finds "no remote
        # refs found for flathub". The manifests target the released runtime
        # rather than nightly — see doc/flatpak.md — so Flathub is where it
        # comes from.
        run: |
          flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remotes --system

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.steeb_k.Commune.flatpak
          manifest-path: ${{ inputs.meson-profile == 'default' && 'build-aux/io.github.steeb_k.Commune.json' || 'build-aux/io.github.steeb_k.Commune.Devel.json' }}
          cache-key: flatpak-${{ hashFiles('build-aux/*.json') }}

      # The repository the bundle above was made from, for apps.kznjk.com.
      # Only a release's: `release.yml` attaches it, and steeb-k/kznjk-flatpak
      # signs and publishes it from there. See `doc/flatpak.md`.
      - name: Pack the Flatpak repository
        if: inputs.meson-profile == 'default'
        run: tar -C repo -cf flatpak-build.tar .

      - uses: actions/upload-artifact@v4
        if: inputs.meson-profile == 'default'
        with:
          name: flatpak-build
          path: flatpak-build.tar
          retention-days: 7

  windows:
    if: >-
      !cancelled()
      && (inputs.platforms == 'all' || contains(format(' {0} ', inputs.platforms), ' windows '))
    name: Windows installer
    runs-on: windows-latest
    # Not a gate, a subject. A federated credential cannot have a wildcard
    # in its subject, and release tags vary in name — so the Azure identity
    # trusts `repo:steeb-k/commune:environment:release`, which one
    # environment satisfies for every tag and for main alike. Nothing is
    # required to approve here; adding a reviewer to the environment later
    # is what would make a release wait for one.
    environment: release
    env:
      # Signing needs an Azure federated credential. Without one the job
      # still builds and still publishes — it just publishes a package the
      # updater will refuse, because `windows_update.rs` checks Authenticode
      # before handing anything to msiexec. That is the right failure: an
      # unsigned installer nobody can auto-install beats a silent downgrade
      # of what "signed" means.
      SIGN_WINDOWS: ${{ inputs.sign && secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The build number is `git rev-list --count HEAD`, and a shallow
          # clone answers that wrongly.
          fetch-depth: 0

      - name: Allow long paths
        # matrix-rust-sdk carries test fixtures whose paths pass 260
        # characters, and git will not check them out without this.
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1
          git config --global core.longpaths true

      - name: Install the WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          wix extension add --global WixToolset.UI.wixext/5.0.0

      - name: Sign in to Azure
        # The first of two. This one exists so the probe below can run before
        # the build, which is what makes a broken credential cost two minutes
        # instead of forty. It is not the one that signs the installer: see
        # the second login, further down.
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Trusted Signing client
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        # The signing library comes from the NuGet package, not from the
        # PowerShell module of the same name — that module wraps its own
        # cmdlet and carries no dlib at all, which is what the first attempt
        # at this discovered. A .nupkg is a zip, so no NuGet client is
        # needed to open one.
        #
        # `sign.ps1` searches the places the standalone client tools install
        # to, none of which this is, so the path is handed over through the
        # variable the script already reads first for exactly this case.
        run: |
          $url = "https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client"
          $zip = Join-Path $env:RUNNER_TEMP "trusted-signing-client.zip"
          $out = Join-Path $env:RUNNER_TEMP "trusted-signing-client"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $dlib = Get-ChildItem -Path $out -Recurse -Filter 'Azure.CodeSigning.Dlib.dll' |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $dlib) {
            $dlib = Get-ChildItem -Path $out -Recurse -Filter 'Azure.CodeSigning.Dlib.dll' | Select-Object -First 1
          }
          if (-not $dlib) { throw "no Azure.CodeSigning.Dlib.dll in the NuGet package" }
          Write-Host "dlib: $($dlib.FullName)"
          "ARTIFACT_SIGNING_DLIB=$($dlib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prove the signing chain works
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          # The same metadata the real signing uses. Without it `sign.ps1`
          # finds no file, prints a warning and returns having signed
          # nothing — which is how the first version of this step passed
          # while signing nothing at all.
          ARTIFACT_SIGNING_METADATA: build-aux/windows/artifact-signing-metadata.ci.json
        # Before the build, not after it. Everything above takes two minutes
        # and the bundle takes forty, so a credential that does not work
        # should say so now — which it did not, twice, having compiled the
        # whole application first.
        run: |
          # A freshly built binary, because the probe has to start out
          # unsigned for the check at the end to mean anything. The first
          # attempt copied a system binary, which Microsoft has already
          # signed, and then asked whether it was signed — proving nothing.
          # The second tried to strip that signature, which cannot be done:
          # system binaries are catalog-signed, so there is no embedded
          # signature to remove and signtool answers 0x57.
          #
          # So: compile one. The .NET Framework compiler is at a fixed path on
          # every Windows image and needs no restore, so this costs a couple
          # of seconds and produces a PE nobody has ever signed.
          $dir = Join-Path $env:RUNNER_TEMP "signprobe"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $src = Join-Path $dir "probe.cs"
          Set-Content $src "class P { static void Main() { } }"
          $probe = Join-Path $dir "probe.exe"
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "no C# compiler at $csc" }
          & $csc /nologo /out:$probe $src
          if (-not (Test-Path $probe)) { throw "the probe did not compile" }

          $before = Get-AuthenticodeSignature $probe
          Write-Host "probe before: $($before.Status)"
          if ($before.Status -eq "Valid") { throw "the probe is already signed; the check would prove nothing" }

          pwsh -File build-aux\windows\sign.ps1 -Files $probe

          $after = Get-AuthenticodeSignature $probe
          Write-Host "probe after:  $($after.Status) by $($after.SignerCertificate.Subject)"
          if ($after.Status -ne "Valid") { throw "the signing chain produced $($after.Status)" }

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # The list from doc/windows.md. MSYS2 is a rolling release with no
          # pinning mechanism, which is a real risk for a release build: GTK
          # can move underneath the port without a commit changing here. The
          # probe table uploaded below is the audit trail for what a given
          # build actually used.
          install: >-
            mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gtksourceview5 mingw-w64-ucrt-x86_64-libshumate
            mingw-w64-ucrt-x86_64-gstreamer mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly mingw-w64-ucrt-x86_64-gst-plugins-rs
            mingw-w64-ucrt-x86_64-libnice mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-libsoup3 mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-blueprint-compiler mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-ntldd mingw-w64-ucrt-x86_64-icoutils
            git

      - name: Restore the Cargo registry and the build
        id: windows-cache
        uses: actions/cache/restore@v4
        with:
          # `CARGO_HOME` stays the default one on purpose: doc/windows.md
          # records that rooting it inside the build directory pushes the
          # SDK's test fixtures past the path limit.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ inputs.windows-profile }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-${{ inputs.windows-profile }}-

      - name: Install grass
        # The stylesheet compiler: a cargo binary rather than an MSYS2
        # package. It lands in %USERPROFILE%\.cargo\bin, which must come
        # after /ucrt64/bin so the MSVC rustup shims there never win.
        shell: msys2 {0}
        run: |
          export PATH="$PATH:$(cygpath -u "$USERPROFILE")/.cargo/bin"
          cargo install --locked grass

      - name: Record what this build used
        shell: msys2 {0}
        run: bash build-aux/windows/probe-env.sh | tee probe-env.txt

      - name: Build the bundle
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        shell: msys2 {0}
        run: |
          export PATH="$PATH:$(cygpath -u "$USERPROFILE")/.cargo/bin"
          meson setup _build -Dprofile=${{ inputs.meson-profile }} -Dklipy-api-key="$KLIPY_API_KEY"
          meson compile -C _build windows-bundle

      - name: Save the Cargo registry and the build
        # Split from the restore for the same reason the macOS environment
        # was: `actions/cache` saves in a post step, and a post step is
        # skipped when the job fails. The release build failed at signing —
        # the last step, seventy minutes in — and threw away every compiled
        # crate on the way out, so the rebuild started from nothing.
        #
        # Saving here rather than at the end is also what keeps a half-built
        # tree from being cached: this only runs because the bundle step
        # before it succeeded.
        if: always() && steps.windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.windows-cache.outputs.cache-primary-key }}

      - name: Sign in to Azure again
        # Because the first sign-in has expired by now, and the failure it
        # causes is unreadable. GitHub's OIDC token — the client assertion
        # that stands in for a client secret — is valid for five minutes. The
        # access token `az login` exchanges it for lasts about an hour, and
        # when that runs out the CLI tries to refresh it using the assertion,
        # which died fifty-five minutes earlier:
        #
        #     AADSTS700024: Client assertion is not within its valid time
        #     range. Current time: 16:17:10Z, assertion valid from 15:06:39Z,
        #     expiry time of assertion 15:11:39Z
        #
        # reaching signtool as `SignerSign() failed (0x80004005)`.
        #
        # Whether it happens depends only on how long the build took. The
        # nightly is a debug build and finishes in about forty minutes, so it
        # never saw this; a release is optimised, takes seventy, and fails
        # every time. Signing a second time from a fresh token is the whole
        # fix — and the two logins are not redundant, because the early one is
        # what lets the probe fail fast.
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build the installer
        shell: pwsh
        env:
          # The metadata beside the repository names only AzureCliCredential,
          # which is right for a laptop with an `az login` session and useless
          # on a runner. The CI copy leaves the credential type OIDC provides.
          ARTIFACT_SIGNING_METADATA: ${{ env.SIGN_WINDOWS == 'true' && 'build-aux/windows/artifact-signing-metadata.ci.json' || '' }}
        run: |
          $name = if ('${{ inputs.windows-profile }}' -eq 'Stable') { 'Commune' } else { 'Commune ${{ inputs.windows-profile }}' }
          pwsh -File build-aux\windows\build-msi.ps1 -BundleDir "_build\windows\$name" -Profile ${{ inputs.windows-profile }}

      - name: Say if it went out unsigned
        if: env.SIGN_WINDOWS != 'true'
        shell: bash
        run: |
          echo "::warning::This MSI is UNSIGNED. The in-app updater will refuse it."
          {
            echo "### Windows package is unsigned"
            echo
            echo "No Azure federated credential is configured, so \`sign.ps1\` was skipped."
            echo "The package installs by hand; the in-app updater checks Authenticode"
            echo "first and will not install it. See \`doc/updates.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            _build/windows/*.msi
            probe-env.txt
          if-no-files-found: error

  macos-half:
    if: >-
      !cancelled()
      && (inputs.platforms == 'all' || contains(format(' {0} ', inputs.platforms), ' macos '))
    name: macOS ${{ matrix.arch }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            conda-platform: osx-arm64
            conda-env: arm64
            conda-flags: ''
            sass-arch: arm64
          - arch: x86_64
            # GitHub retires the Intel runner in autumn 2027. When it goes
            # this half either cross-builds under Rosetta or the universal
            # binary becomes an arm64 one; the feed's asset key does not
            # change either way.
            runner: macos-15-intel
            conda-platform: osx-64
            conda-env: x86
            # NOT `--universal`. That builds the arm64 environment too, whose
            # post-link scripts are arm64 binaries — and while Rosetta runs
            # x86 on Apple Silicon, nothing runs arm64 on an Intel Mac. The
            # first attempt died here, on gdk-pixbuf's loader cache.
            conda-flags: '--x86-only'
            sass-arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore the conda environment and the from-source libraries
        id: conda-cache
        uses: actions/cache/restore@v4
        with:
          # The three from-source projects — libsrtp2, libnice and a rebuilt
          # gst-plugins-bad — are the slow part of the setup and are pinned by
          # version, so they are identical on every run until a pin changes.
          path: .conda-gtk
          key: conda-${{ matrix.arch }}-${{ hashFiles('build-aux/macos/setup-conda-macos.sh') }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-${{ matrix.arch }}
          # A build that fails has still compiled several hundred
          # dependencies, and throwing those away means the next attempt at
          # the same bug pays for them again.
          cache-on-failure: true

      - name: Install micromamba
        run: |
          mkdir -p "$PWD/bin"
          curl -Ls "https://micro.mamba.pm/api/micromamba/${{ matrix.conda-platform }}/latest" | tar -xvjO bin/micromamba > "$PWD/bin/micromamba"
          chmod +x "$PWD/bin/micromamba"
          echo "COMMUNE_CONDA_BIN=$PWD/bin/micromamba" >> "$GITHUB_ENV"

      - name: Build the environment
        # `--universal` on the Intel half because the script's single-env path
        # always builds the osx-arm64 one; the x86 env only exists under that
        # flag. It costs that runner the from-source trio twice, which the
        # cache above pays for only once.
        run: bash build-aux/macos/setup-conda-macos.sh ${{ matrix.conda-flags }}

      - name: Save the conda environment
        # Deliberately not `actions/cache`, whose saving half runs as a post
        # step — and a post step is skipped when the job fails. The x86_64
        # half failed twice after building its environment, and threw away
        # twelve minutes of work both times, so each attempt at the next bug
        # rebuilt it from nothing. This saves the moment the environment
        # exists, which is also the only moment it is known to be complete:
        # running here rather than at the end means a half-built environment
        # from a failed setup is never what gets cached.
        if: steps.conda-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .conda-gtk
          key: ${{ steps.conda-cache.outputs.cache-primary-key }}

      - name: A SASS compiler
        # `data/resources/meson.build` wants `grass` or `sass`, and neither
        # half had one. The first macOS attempt spent nine minutes building
        # the whole conda environment before `meson setup` said so. The
        # Linux gate downloads this same prebuilt dart-sass; the Windows job
        # builds grass with cargo instead.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sass.tar.gz" "https://github.com/sass/dart-sass/releases/download/1.83.4/dart-sass-1.83.4-macos-${{ matrix.sass-arch }}.tar.gz"
          tar -xzf "$RUNNER_TEMP/sass.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Build the bundle
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          # The release profile wants about 11 GB on its own with debug info
          # on, and a runner does not have it. Dropping the debug info and
          # letting codegen parallelise is the documented way out, set here
          # rather than in Cargo.toml so that Linux and Flatpak keep their
          # backtraces. See doc/macos.md.
          CARGO_PROFILE_RELEASE_DEBUG: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: |
          env_dir="$PWD/.conda-gtk/${{ matrix.conda-env }}"
          # PKG_CONFIG_LIBDIR matters as much as PKG_CONFIG_PATH: it replaces
          # the default search path, so nothing leaks in from a Homebrew
          # prefix and quietly turns this into a Rosetta binary.
          export PKG_CONFIG_PATH="$env_dir/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$env_dir/lib/pkgconfig"
          export PATH="$env_dir/bin:$PATH"
          export GI_TYPELIB_PATH="$env_dir/lib/girepository-1.0"
          export XDG_DATA_DIRS="$env_dir/share"
          export MACOSX_DEPLOYMENT_TARGET=11.0
          bash build-aux/macos/probe-env.sh || true
          meson setup _build -Dprofile=${{ inputs.meson-profile }} -Dklipy-api-key="$KLIPY_API_KEY"
          meson compile -C _build macos-bundle

      - name: Record the deployment target
        # The reason this bundle runs on macOS 11 is that conda-forge builds
        # against an old SDK whatever machine is used. If this prints the
        # runner's own OS version instead, something Homebrew-built has crept
        # in — the mistake doc/macos.md records as having shipped once already
        # in a sibling project.
        run: |
          for binary in _build/macos/*.app/Contents/MacOS/*; do
            vtool -show-build "$binary" | grep -A2 minos || true
          done

      - name: Pack the half
        # Not `path: *.app`. `upload-artifact` does not preserve the
        # executable bit and it resolves symlinks rather than storing them,
        # and an application bundle is made of both: the thing in
        # `Contents/MacOS` has to be executable to launch, and a GTK bundle's
        # `lib` directory is mostly `libfoo.0.dylib -> libfoo.0.1.dylib`.
        # Round-tripping one through an artifact therefore produces a bundle
        # several times the size that cannot run and cannot be signed — and
        # `lipo-bundles.sh` copies each input's permissions onto its output,
        # so the damage would survive the merge.
        #
        # A tar holds both. This is the same reason the finished bundle ships
        # as a tarball rather than a disk image, for once not about
        # quarantine.
        run: |
          bundle="$(find _build/macos -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$bundle" ]; then
            echo "::error::meson produced no .app under _build/macos"
            exit 1
          fi
          mkdir -p half
          tar -czf half/bundle.tar.gz -C "$(dirname "$bundle")" "$(basename "$bundle")"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: half/bundle.tar.gz
          if-no-files-found: error

  macos:
    if: >-
      !cancelled()
      && needs['macos-half'].result == 'success'
      && (inputs.platforms == 'all' || contains(format(' {0} ', inputs.platforms), ' macos '))
    needs: [macos-half]
    name: macOS universal bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: halves/arm64

      - uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: halves/x86_64

      - name: Unpack the two halves
        # See the packing step in the half job: the bundles travel as tars so
        # that the executable bits and the symlinks arrive with them.
        run: |
          for arch in arm64 x86_64; do
            tar -xzf "halves/$arch/bundle.tar.gz" -C "halves/$arch"
          done
          ls -la halves/arm64 halves/x86_64

      - name: Merge the two halves
        run: |
          arm64_bundle="$(find halves/arm64 -maxdepth 2 -name '*.app' | head -1)"
          x86_64_bundle="$(find halves/x86_64 -maxdepth 2 -name '*.app' | head -1)"
          for bundle in "$arm64_bundle" "$x86_64_bundle"; do
            if [ -z "$bundle" ]; then
              echo "::error::a half is missing its .app after unpacking"
              exit 1
            fi
            # If this is not executable the tar did not do its job, and
            # everything downstream would succeed while producing a bundle
            # that cannot launch. Globbed rather than named: the binary is
            # `commune` in lower case and the bundle around it is
            # `Commune.app` only on the Stable profile — a nightly's is
            # `Commune Devel.app`.
            if ! find "$bundle/Contents/MacOS" -type f -perm -u+x | grep -q .; then
              echo "::error::$bundle has no executable in Contents/MacOS"
              ls -la "$bundle/Contents/MacOS" || true
              exit 1
            fi
          done
          # The bundle keeps the name the half had. `bundle.sh` calls it
          # `Commune.app` only on the Stable profile; a nightly is
          # `Commune Devel.app`, and that is what keeps a nightly installed
          # beside a stable Commune in /Applications rather than on top of
          # it. Hardcoding the stable name here would have undone, at the
          # last step, what the Devel application id is for.
          app="universal/$(basename "$arm64_bundle")"
          echo "COMMUNE_APP=$app" >> "$GITHUB_ENV"
          bash build-aux/macos/lipo-bundles.sh --arm64 "$arm64_bundle" --x86_64 "$x86_64_bundle" --output "$app"

      - name: Sign, notarize and staple
        # Signing happens after the merge, never before: a signature covers
        # all of a binary's slices at once, so signing the halves and then
        # merging them produces a bundle whose signature does not check out.
        if: inputs.sign
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          # Either an App Store Connect API key or an app-specific password;
          # sign-notarize.sh takes whichever is present. Notarization is not
          # the App Store — it is the other half of Developer ID, and this
          # project could not be listed in any case, being GPL-3 with many
          # copyright holders.
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          # Set this repository variable to ship signed but un-notarized,
          # which the in-app updater installs and a browser download does not.
          ALLOW_UNNOTARIZED: ${{ vars.ALLOW_UNNOTARIZED }}
        run: bash build-aux/macos/sign-notarize.sh "$COMMUNE_APP"

      - name: Make the tarball
        # A tarball rather than the disk image, because files a process
        # extracts from one are never quarantined and a quarantined bundle is
        # refused on first launch. This is what the updater downloads.
        run: |
          version="$(bash build-aux/ci/project-version.sh)"
          mkdir -p dist
          bash build-aux/macos/make-tarball.sh "$COMMUNE_APP" "dist/commune-$version-universal.tar.gz"

      - name: Make the disk image
        # Both shapes ship, because they are for different things and neither
        # substitutes for the other.
        #
        # The disk image is what a person downloading from the release page
        # expects: open it, drag the icon to Applications. The tarball is what
        # the updater fetches, and it has to be a tarball — a process that
        # extracts one never sets `com.apple.quarantine`, while anything a
        # browser downloads carries it, and a quarantined app is checked by
        # Gatekeeper on first launch. The feed keeps pointing at the tarball.
        run: |
          version="$(bash build-aux/ci/project-version.sh)"
          bash build-aux/macos/make-dmg.sh "$COMMUNE_APP" "dist/commune-$version-universal.dmg"

      - name: Notarize the disk image
        # The app inside was notarized and stapled before the image was built,
        # but Gatekeeper checks the image's own ticket first when a browser
        # downloaded it — so the image needs one of its own.
        if: inputs.sign
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          ALLOW_UNNOTARIZED: ${{ vars.ALLOW_UNNOTARIZED }}
        run: |
          dmg="$(find dist -name '*.dmg' | head -1)"
          bash build-aux/macos/sign-notarize.sh --notarize-only "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error
