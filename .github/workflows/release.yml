# A tag becomes a release, and a release becomes a feed.
#
# Pushing a `v*` tag is the whole of making a release. It builds every
# platform, attaches the artifacts to a GitHub release, and then writes the
# manifest an installed Commune reads to find out that the release exists —
# see `doc/updates-plan.md`.
#
# `RELEASING.md` still owns the commit that comes before the tag: the version
# in three files, the metainfo entry, the screenshots. This owns everything
# after it.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to build and publish.'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      meson-profile: default
      windows-profile: Stable
      sign: true
      # Always everything. A release that quietly dropped a platform would
      # publish a manifest telling that platform there is nothing to install.
      platforms: all
      # The tag's source, even when this was dispatched from a branch. That
      # combination is the recovery path for a CI bug: the workflow comes from
      # wherever it was dispatched, so it carries the fix, while the code
      # built and published stays exactly what the tag points at.
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit

  publish:
    # In `publish.yml`, so that `assemble.yml` can run the same steps against
    # an earlier run's artifacts. The channels are worked out there from the
    # version: a candidate goes to `rc`, a release to `stable` and `rc`.
    name: Publish the release and the feed
    needs: build
    uses: ./.github/workflows/publish.yml
    with:
      kind: release
      tag: ${{ inputs.tag || github.ref_name }}
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit
