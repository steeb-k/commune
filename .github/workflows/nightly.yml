# A build of `main`, when somebody asks for one.
#
# This replaces the loop it used to take to see a change on three platforms:
# build the Windows bundle in MSYS2, build the Mac bundle on the Mac, build the
# APK in WSL, copy each one where it has to go. One press does all of it, and a
# Devel installation following the `nightly` channel picks the result up on its
# own.
#
# # Why not on every push
#
# Because five platforms take the better part of two hours, and most commits
# touch code that three of them do not compile. Free minutes on a public
# repository make that affordable, not useful: it is queue time and noise for a
# result nobody asked for. So the trigger is a press, plus one scheduled build
# a week so the channel does not go stale while attention is elsewhere.
#
# It matters more than it looks, because there is no Mac: CI is the only way a
# macOS build gets made at all. Tying that to release tags would mean minting a
# permanent tag and bumping three version files every time somebody wanted to
# see a change on macOS, which is a worse manual loop than the one this
# replaced.
#
# # Why Devel
#
# A nightly carries the Devel application id, data directory and MSI
# UpgradeCode, so it installs beside a stable Commune rather than over it. That
# is also why `Channel::Nightly` is only offered to a Devel build — see
# `commune-core/src/updates/mod.rs`.
name: nightly

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build: all, or a space-separated list of windows macos android flatpak.'
        required: false
        default: all
        type: string
      publish:
        description: 'Publish to the nightly release and the update feed. Off builds artifacts only, which is what debugging a platform wants.'
        required: false
        default: true
        type: boolean
  schedule:
    # Sundays, 04:00 UTC. Late enough to be nobody's working hours and rare
    # enough that a week of silence still ends in a build that is known to
    # work — which is the thing a channel nobody has pressed in a while
    # otherwise stops being.
    - cron: '0 4 * * 0'

# One build at a time. A second press makes the first one's answer stale.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      meson-profile: development
      windows-profile: Devel
      sign: true
      # A schedule has no inputs, so it gets the defaults.
      platforms: ${{ inputs.platforms || 'all' }}
    secrets: inherit

  publish:
    name: Publish the nightly and the feed
    needs: build
    # Never when a platform was skipped: a manifest written from a partial
    # build would tell every other platform there is nothing to install, which
    # is indistinguishable from a release that dropped them.
    if: >-
      github.event_name == 'schedule' ||
      (inputs.publish && (inputs.platforms == 'all' || inputs.platforms == ''))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Work out what this build is
        id: nightly
        run: |
          version="$(bash build-aux/ci/project-version.sh)"
          build="$(git rev-list --count HEAD)"
          {
            echo "version=$version"
            echo "build=$build"
            echo "sha=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Collect the artifacts
        run: |
          mkdir -p dist
          # Not a blanket `*.tar.gz`. The two macOS halves travel as
          # `bundle.tar.gz` so that the artifact store keeps their executable
          # bits and symlinks, and a blanket glob attached one of them to the
          # v1.rc1 release: 105 MB, indistinguishable from the real download
          # except that it runs on half the Macs. They are build
          # intermediates and have no business here.
          find artifacts -type f \
              \( -name '*.msi' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.apk' -o -name '*.flatpak' \) \
              -not -name 'bundle.tar.gz' \
              -exec cp {} dist/ ';'
          ls -la dist

      - name: Replace the rolling nightly release
        # The one place `RELEASING.md`'s rule that a tag is never moved does
        # not hold, and it says so: this tag is a pointer to "the newest build
        # of main", which is the only thing a nightly channel can mean. Every
        # other tag in the repository is still permanent.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash build-aux/ci/publish-release.sh \
            --tag nightly \
            --title "Nightly ${{ steps.nightly.outputs.version }} (${{ steps.nightly.outputs.sha }})" \
            --notes "An automatic build of main at ${{ steps.nightly.outputs.sha }}. Not a release: it installs beside a stable Commune rather than over it." \
            --prerelease \
            --target "$GITHUB_SHA" \
            --replace \
            -- dist/*

      - name: Write and sign the feed
        env:
          UPDATE_FEED_PRIVATE_KEY: ${{ secrets.UPDATE_FEED_PRIVATE_KEY }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/nightly"
          notes_url="https://github.com/${{ github.repository }}/commits/main"

          assets=""
          msi="$(find dist -name '*.msi' | head -1)"
          # Named, not `head -1`. With the halves excluded above there is only
          # one tarball left, but picking the first of a glob is how the feed
          # for that release came to point at the right file by luck rather
          # than by construction.
          tarball="$(find dist -name 'commune-*-universal.tar.gz' | head -1)"
          apk="$(find dist -name '*.apk' | head -1)"
          [ -n "$msi" ] && assets="$assets --asset windows-x86_64-msi|$msi|$base/$(basename "$msi")"
          [ -n "$tarball" ] && assets="$assets --asset macos-universal-tar|$tarball|$base/$(basename "$tarball")"
          [ -n "$apk" ] && assets="$assets --asset android-arm64-apk|$apk|$base/$(basename "$apk")"

          # shellcheck disable=SC2086
          bash build-aux/ci/publish-feed.sh \
            --channel nightly \
            --version "${{ steps.nightly.outputs.version }}" \
            --build "${{ steps.nightly.outputs.build }}" \
            --notes-url "$notes_url" \
            --out-dir feed \
            $assets

      - name: Commit the feed
        run: bash build-aux/ci/commit-feed.sh feed "nightly ${{ steps.nightly.outputs.sha }}"
