<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Interlocking fingers chat bubble</title>

  <!-- All geometry is flattened: no clipPath, mask or filter anywhere. QtSvg
       implements SVG Tiny 1.2 and silently ignores clip-path, which made the
       backing shapes render full-bleed in Qt-based launchers and panels while
       looking correct under librsvg. Keep new shapes trimmed to the silhouette
       by hand rather than clipping them. -->

