<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  MSYS2's fontconfig package ships no `emoji` generic-family alias.

  That alias is what HarfBuzz/Pango's colour-glyph selection asks fontconfig
  for specifically: a codepoint followed by U+FE0F (VARIATION SELECTOR-16,
  requesting the emoji presentation rather than the text one) is resolved by
  a dedicated `family=emoji` lookup, not by ordinary per-character coverage
  fallback, which is a separate path that finds Segoe UI Emoji on its own
  regardless of this file. Without the alias, `family=emoji` resolves to
  nothing, so every emoji Commune stores with an explicit U+FE0F (its own
  default quick reactions, and anything synced from `m.recent_emoji` written
  by another client) shows as a hex-code box instead of Windows' own emoji
  font, which is otherwise perfectly able to draw it.
-->
<fontconfig>
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Segoe UI Emoji</family>
    </prefer>
  </alias>
</fontconfig>
