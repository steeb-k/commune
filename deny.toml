[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-gnu",
]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0247", reason = "bitmaps is unmaintained but used by dependencies of matrix-sdk" },
    { id = "RUSTSEC-2026-0319", reason = "anymap2 is unmaintained but used by matrix-sdk itself" },
    { id = "RUSTSEC-2026-0292", reason = "imbl-sized-chunks 0.1 is pinned by imbl 6, which eyeball-im and matrix-sdk pin; the fix is imbl 7, which only an SDK bump can take. Re-check at the next rebase." },
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 is pinned by tantivy 0.26, which matrix-sdk-search pins; the fix is zstd 0.14, which only an SDK bump can take. Re-check at the next rebase." },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 comes with zstd 0.13, above; the fix is zstd-safe 8. Re-check at the next rebase." },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 comes with zstd 0.13, above; the fix is zstd-safe 8. Re-check at the next rebase." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 is part of zbus 5, which ashpd 0.13 (the newest there is) and oo7 use; zbus 6 folded it in. Re-check when ashpd moves to zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 is part of zbus 5, above. Re-check when ashpd moves to zbus 6." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 is part of zbus 5, above. Re-check when ashpd moves to zbus 6." },
]

[bans]
multiple-versions = "allow"

# To check if a license if compatible with our GPL v3.0 license, see: https://www.gnu.org/licenses/license-list.html
# Keep list sorted alphabetically.
[licenses]
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-git = "deny"
required-git-spec = "rev"
allow-git = [
    "https://github.com/ruma/ruma",
    "https://github.com/matrix-org/matrix-rust-sdk",
    "https://github.com/matrix-org/vodozemac",
]
unused-allowed-source = "allow"
